[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auto-agent-system"
version = "0.1.0"
authors = [
    { name = "Andrew Zhu", email = "andrew@zhu.codes" },
]
description = "A toolkit for recursive delegation of LLMs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    # https://pypi.org/classifiers/
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "graphviz>=0.20.3,<1.0.0",
    "openai>=1.35.2,<2.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "rapidfuzz>=3.9.0,<4.0.0",
]

[project.optional-dependencies]
all = [
    "auto-agent-system[bundled,web,observability]"
]

bundled = [
    "httpx>=0.23.0,<1.0.0",
    "numpy>=1.26.0,<2.0.0",
    "playwright>=1.43.0,<2.0.0",
    "PyMuPDF>=1.24.3,<2.0.0",
    "pymupdf4llm~=0.0.1",
    "trafilatura>=1.9.0,<2.0.0",
    "duckduckgo_search>=6.3.0,<7.0.0",
]

web = [
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn~=0.23.2",
    "websockets~=11.0.3",
]

observability = [
    "opentelemetry-sdk>=1.25.0,<2.0.0",
    "opentelemetry-exporter-otlp>=1.25.0,<2.0.0",
]

[tool.hatch]


[tool.hatch.build.targets.sdist]
exclude = [
    "sandbox",
    "viz",
]

[tool.hatch.build.targets.wheel]
packages = [
    "AutoAgentSystem",
]
artifacts = [
    "AutoAgentSystem/server/viz_dist",
]

[tool.black]
line-length = 120
preview = true

[tool.isort]
profile = "black"
skip_gitignore = true
line_length = 120
# I am bound by pycharm's import autosorting rules
no_lines_before = "LOCALFOLDER"
reverse_relative = true
combine_as_imports = true
order_by_type = false
